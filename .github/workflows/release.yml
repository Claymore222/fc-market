# v0.2.0 gibi bir tag push edilince: testler → paket (publish.ps1, .NET ve Python gömülü) → GitHub Release'e zip.
# Tag'deki sürüm (v'siz) uygulamanın sürümü olur. Elle çalıştırma: Actions → Release → Run workflow (yalnız test + paket).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Sürüm
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag vX.Y.Z biçiminde olmalı: $env:GITHUB_REF_NAME" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Bağımlılıklar
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements.txt

      # Her grup ayrı adım; kırılan testler ::error:: notu olarak düşer (notlar giriş yapmadan da okunur).
      - name: Backend testleri
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test backend/FcMarket.Tests --nologo --logger "console;verbosity=normal" 2>&1 | tee dotnet-test.log; then
            grep -E '^\s*(Failed |Error Message|Expected|Actual|Assert\.|.*error [A-Z]+[0-9]+)' dotnet-test.log | head -40 \
              | sed -E 's/^\s+//; s/^/::error title=Backend testi::/'
            exit 1
          fi

      - name: Python testleri
        shell: bash
        run: |
          set -o pipefail
          for suite in tools/saveimport/tests tools/assets/tests; do
            if ! python -m unittest discover -s "$suite" 2>&1 | tee python-test.log; then
              grep -E '^(FAIL|ERROR):|Error:|Exception:|assert' python-test.log | head -40 \
                | sed "s|^|::error title=Python testi ($suite)::|"
              exit 1
            fi
          done

      - name: Arayüz testleri
        run: npm --prefix frontend run test:e2e -- --reporter=github,line

      - name: Paket
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.version.outputs.value }}

      - name: SHA-256
        shell: pwsh
        run: |
          $zip = "artifacts/FcMarket-v${{ steps.version.outputs.value }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FcMarket-v${{ steps.version.outputs.value }}.zip" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Paketi sakla (elle çalıştırma)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: FcMarket
          path: artifacts/FcMarket-v*.zip*

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FC Market ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/FcMarket-v${{ steps.version.outputs.value }}.zip
            artifacts/FcMarket-v${{ steps.version.outputs.value }}.zip.sha256
